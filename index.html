<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1420"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Arry's World">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>[hidden]{display:none!important}html,body{margin:0;height:100%;overscroll-behavior:none}</style></head><body><title>Arry's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D canvas, glass HUD pinned to the safe-area edges, menus as a left-hand scroll panel over the live world. */
:root{
  color-scheme: dark;
  --glass: rgba(18,22,32,.72);
  --glass-strong: rgba(24,28,40,.92);
  --ink: #fff6e8;
  --ink-dim: rgba(255,246,232,.7);
  --line: rgba(255,246,232,.16);
  --gold: #ffc23d;
  --gold-deep: #e39a12;
  --pink: #ff5d9e;
  --jacaranda: #a07ddc;
  --ok: #5ad68f;
  --display: 'Baloo 2', 'Trebuchet MS', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
}
html,body{height:100%;margin:0;overflow:hidden;background:#20160f;color:var(--ink);font-family:var(--body);}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#c{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;}
#touch{position:fixed;inset:0;touch-action:none;}
button{font-family:var(--body);touch-action:manipulation;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;}
#hud .tap{pointer-events:auto}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);}
#topbar{position:absolute;top:calc(8px + var(--st));left:calc(10px + var(--sl));right:calc(10px + var(--sr));display:flex;align-items:flex-start;gap:10px;}
#pauseBtn,#fsBtn,#gamesBtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
#pauseBtn span{display:block;width:18px;height:2.5px;background:var(--ink);border-radius:2px;box-shadow:0 6px 0 var(--ink),0 -6px 0 var(--ink)}
#compass{position:relative;flex:1;max-width:620px;margin:0 auto;height:46px;border-radius:14px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);}
#cmarks .m{position:absolute;top:6px;width:2px;height:8px;margin-left:-1px;background:rgba(255,246,232,.45);border-radius:1px}
#cmarks .m.big{height:12px;background:rgba(255,246,232,.8)}
#cmarks .lbl{position:absolute;top:20px;transform:translateX(-50%);font:800 12px/1 var(--body);letter-spacing:.08em;color:var(--ink-dim)}
#cmarks .lbl.n{color:#ff7a7a}
.cnotch{position:absolute;left:50%;top:0;width:0;height:0;margin-left:-6px;border:6px solid transparent;border-top:7px solid var(--ink)}
#cping{position:absolute;top:2px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px;transition:opacity .2s}
#cping .pin{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--gold);box-shadow:0 0 0 3px rgba(255,194,61,.3),0 0 14px rgba(255,194,61,.9)}
#cping .plabel{font:800 11px/1 var(--body);letter-spacing:.06em;color:var(--gold);white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#cping.edge-l .pin,#cping.edge-r .pin{border-radius:4px;transform:none;width:14px;height:18px;clip-path:polygon(0 50%,100% 0,100% 100%)}
#cping.edge-r .pin{clip-path:polygon(0 0,100% 50%,0 100%)}
#stats{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.pillrow{display:flex;gap:6px}
.pill{height:30px;border-radius:999px;padding:0 10px 0 6px;display:flex;align-items:center;gap:6px;font:800 14px/1 var(--body);font-variant-numeric:tabular-nums}
.coin-ico{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc23d 45%,#c98a0c);box-shadow:inset 0 0 0 2px rgba(120,70,0,.35)}
.lvl-ico{min-width:20px;height:20px;border-radius:6px;background:var(--jacaranda);display:grid;place-items:center;font:900 11px/1 var(--body);padding:0 3px}
.xpbar{width:54px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--jacaranda),#d7b8ff);width:0}
#swapBtn{height:40px;border-radius:999px;padding:0 12px 0 4px;display:flex;align-items:center;gap:8px;font:800 13px/1 var(--body)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 15px/1 var(--display);color:#fff}
.av.dad{background:#3d4a5c;box-shadow:inset 0 0 0 2px #8fa3bd}
.av.arry{background:var(--pink);box-shadow:inset 0 0 0 2px #ffc0da}

#missionCard{position:absolute;top:calc(64px + var(--st));left:calc(10px + var(--sl));width:min(290px,46vw);border-radius:16px;padding:10px 12px 10px;}
.mc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mc-eyebrow{font:800 10px/1 var(--body);letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
#mcTitle{font:700 17px/1.1 var(--display);flex:1;min-width:0;text-wrap:balance}
#mcTimer{font:800 13px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--ink-dim);padding:4px 7px;border-radius:8px;background:rgba(255,255,255,.08)}
#mcSteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
#mcSteps li{display:flex;gap:8px;align-items:flex-start;font:700 13.5px/1.25 var(--body);color:var(--ink-dim)}
#mcSteps li .bx{flex:none;width:17px;height:17px;border-radius:5px;border:2px solid rgba(255,246,232,.45);margin-top:1px;display:grid;place-items:center}
#mcSteps li.done{color:rgba(255,246,232,.5);text-decoration:line-through;text-decoration-color:rgba(255,246,232,.35)}
#mcSteps li.done .bx{background:var(--ok);border-color:var(--ok)}
#mcSteps li.done .bx::after{content:"";width:5px;height:9px;border:solid #10301e;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
#mcSteps li.cur{color:var(--ink)}
#mcSteps li.cur .bx{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,194,61,.25)}
#missionCard.mini #mcSteps li:not(.cur){display:none}
#toast{position:absolute;left:50%;top:calc(64px + var(--st));transform:translate(-50%,-10px);opacity:0;transition:.25s;padding:10px 16px;border-radius:14px;font:800 16px/1.2 var(--display);text-align:center;max-width:70vw;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.gold{background:linear-gradient(180deg,#ffd666,#f0a91a);color:#3a2300;border-color:transparent}
#speedo{position:absolute;bottom:calc(20px + var(--sb));left:50%;transform:translateX(-50%);border-radius:16px;padding:8px 14px;text-align:center;}
#speedo b{font:800 26px/1 var(--display);font-variant-numeric:tabular-nums}
#speedo small{display:block;font:800 10px/1 var(--body);letter-spacing:.12em;color:var(--ink-dim)}
#joyBase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);opacity:.0;transition:opacity .15s}
#joyBase.on{opacity:1}
#joyBase.ghost{opacity:.55}
#joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,246,232,.85);box-shadow:0 4px 12px rgba(0,0,0,.35)}
#btns{position:absolute;right:calc(16px + var(--sr));bottom:calc(16px + var(--sb));display:flex;align-items:flex-end;gap:12px}
.rbtn{border-radius:50%;display:grid;place-items:center;font:800 13px/1 var(--body);letter-spacing:.04em}
#jumpBtn{width:78px;height:78px;background:rgba(255,246,232,.9);color:#2a2018;border:none;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#jumpBtn:active{transform:scale(.94)}
#emoteBtn{width:58px;height:58px;background:rgba(32,38,52,.82);color:var(--ink);border:1px solid var(--line);font-size:11px;margin-bottom:8px}
#bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bubble{position:absolute;left:0;top:0;max-width:220px;padding:8px 12px;border-radius:14px;background:#fffaf0;color:#2a2018;font:800 14px/1.25 var(--body);box-shadow:0 6px 18px rgba(0,0,0,.25);margin-top:-10px;white-space:normal;text-align:center}
.bubble::after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:#fffaf0;border-bottom:0}
#actionBtn{width:70px;height:70px;background:linear-gradient(180deg,#ffd666,#f0a91a);color:#3a2300;border:none;box-shadow:0 6px 18px rgba(0,0,0,.35);margin-bottom:30px}
#hint{position:absolute;left:50%;bottom:calc(110px + var(--sb));transform:translateX(-50%);padding:10px 14px;border-radius:14px;font:700 14px/1.35 var(--body);text-align:center;max-width:min(520px,80vw);transition:opacity .6s}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;}
#menu{background:linear-gradient(90deg,rgba(16,12,10,.86) 0%,rgba(16,12,10,.62) 46%,rgba(16,12,10,0) 78%);}
.panel{position:absolute;top:0;bottom:0;left:0;width:min(520px,100%);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  padding-top:calc(18px + var(--st));padding-bottom:calc(24px + var(--sb));padding-left:max(16px, calc(var(--sl) + 18px));padding-right:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.logo{display:flex;flex-direction:column;gap:0}
.logo h1{margin:0;font:800 clamp(44px,9vw,64px)/.9 var(--display);letter-spacing:-.01em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.35);display:flex;align-items:flex-start;gap:6px}
.logo h1 svg{width:.42em;height:.42em;margin-top:.12em}
.logo p{margin:4px 0 0 3px;font:800 12px/1 var(--body);letter-spacing:.32em;color:var(--gold)}
.seg{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg .lab{font:800 12px/1 var(--body);letter-spacing:.12em;color:var(--ink-dim);text-transform:uppercase}
.seg .opts{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:4px;gap:4px}
.seg button{border:none;background:transparent;border-radius:999px;padding:5px 14px 5px 5px;display:flex;align-items:center;gap:8px;font:800 14px/1 var(--body);color:var(--ink-dim)}
.seg button .av{width:26px;height:26px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#2a2018}
.wardrobe{display:flex;flex-direction:column;gap:8px}
.wrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wrow .lab{font:800 11px/1 var(--body);letter-spacing:.12em;color:var(--ink-dim);text-transform:uppercase;min-width:92px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:999px;padding:7px 12px;font:800 13px/1 var(--body);color:var(--ink-dim)}
.chip[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.gate h2,.free h2{font-size:26px}
.qcard,.today{position:relative}
.say{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.14);font-size:18px;line-height:1;z-index:2}
.qcard p.big,.today h2{padding-right:40px}
.drow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.drow label{min-width:70px;margin:0}
.drow input{flex:1;min-width:90px}
.presence{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:8px 0 2px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.08);font:800 14px/1.2 var(--body)}
.presence.on{background:rgba(90,214,143,.2);border:1px solid rgba(90,214,143,.5)}
.presence.off{color:var(--ink-dim);font-weight:700}
.presence .heart{padding:7px 12px;font-size:13px}
#rotate{display:none;position:fixed;inset:0;z-index:999;place-items:center;text-align:center;padding:24px;background:#1b1420;color:#fff;font:800 22px/1.3 var(--display)}
#rotate span{display:block;font-size:64px;margin-bottom:12px;animation:rot 1.8s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:grid}}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:5px;border-radius:18px;background:rgba(0,0,0,.28);position:sticky;top:0;z-index:5;background:#2a2030}
.tabs button{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 4px;border-radius:13px;border:0;background:transparent;color:var(--ink-dim);font:800 14px/1 var(--body)}
.tabs button span{font-size:18px}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,#ffc94d,#ff9f2e);color:#2a1408;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tabs .dot{position:absolute;top:6px;right:10px;width:9px;height:9px;border-radius:50%;background:#ff3d6e}
.mlist.big{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.mlist.big .mcard{padding:16px 14px}
.mcard.pickme{grid-column:1/-1;background:linear-gradient(120deg,rgba(255,194,61,.28),rgba(255,93,158,.2));border-color:rgba(255,214,120,.55)}
.mcard:active,.chip:active,.play:active,.btn2:active,.step:active,.mood:active{transform:scale(.96)}
.mcard,.chip,.play,.btn2,.step,.mood{transition:transform .08s ease}
#menuPanel>*{animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#menuPanel>*{animation:none}}
#fade{position:fixed;inset:0;z-index:18;background:#1b1420;opacity:0;pointer-events:none;transition:opacity .3s ease}
#fade.on{opacity:1}
.chips.go{display:flex;flex-wrap:wrap;gap:8px}
.chips.go .chip{padding:11px 14px;font-size:14px}
.countdown{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.countdown span{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.1);font:700 13px/1.2 var(--body)}
.countdown b{color:var(--gold)}
.party{margin:8px 0 4px;padding:10px 12px;border-radius:14px;background:linear-gradient(90deg,#ff5d9e,#ffb02e);color:#2a1408;font:800 18px/1.2 var(--display);text-align:center}
.dadturn{margin-top:8px;background:linear-gradient(160deg,rgba(61,139,255,.2),rgba(90,200,255,.1));border-color:rgba(120,180,255,.35)}
.voice{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.voice audio,.scrap audio{height:34px;max-width:100%}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin:8px 0}
.stk{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,.1);font:700 11px/1.15 var(--body);text-align:center}
.stk span{font-size:30px;line-height:1}
.stk.off{opacity:.35}
.today.free{background:rgba(255,255,255,.06);border-color:var(--line)}
.slots{display:flex;gap:8px;margin:6px 0 10px}
.slots span{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.1);border:2px dashed rgba(255,255,255,.35);display:grid;place-items:center;font-size:30px}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.keypad button{height:58px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.1);font-size:30px}
.keypad button:active{transform:scale(.94)}
.dadkey{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 2px;padding:8px 12px;border-radius:14px;background:rgba(0,0,0,.25)}
.dadkey span{font:800 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.dadkey b{font-size:28px;letter-spacing:.15em}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.step{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;padding:7px 6px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);font:800 11px/1 var(--body);color:var(--ink-dim)}
.step span{font-size:20px;line-height:1}
.step.done{background:rgba(90,214,143,.18);border-color:rgba(90,214,143,.5);color:var(--ok)}
.step.cur{border-color:var(--gold);color:var(--ink);box-shadow:0 0 0 3px rgba(255,194,61,.25)}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mood{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.07);font:800 13px/1 var(--body)}
.mood span{font-size:34px;line-height:1}
.qcard{border-radius:16px;padding:14px;background:linear-gradient(160deg,rgba(255,194,61,.18),rgba(255,93,158,.12));border:1px solid rgba(255,214,120,.3)}
.qcard p{margin:0;color:var(--ink)}
.qcard p.big{font:700 20px/1.35 var(--display)}
.qcard .story{margin-top:8px;font-style:italic;color:var(--ink-dim)}
.qcard.small{padding:10px 12px}
.qcard.mem img,.scrap img{display:block;max-width:100%;border-radius:10px;margin:6px 0}
#pad{width:100%;max-width:100%;aspect-ratio:3/2;border-radius:14px;background:#fffaf0;touch-action:none;cursor:crosshair}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
.scrap{padding:10px;border-radius:14px;background:rgba(255,255,255,.06)}
.scrap p{margin:0;color:var(--ink);font:600 14px/1.4 var(--body)}
.scrap span{color:var(--ink-dim);font-size:12px}
.btn2.role{display:flex;align-items:center;gap:8px}
.btn2.role.sel{background:var(--ink);color:#2a2018}
details.settings summary{cursor:pointer;font:800 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);padding:6px 0}
.sheet.peek{place-items:end center;background:transparent}
.today{border-radius:20px;padding:16px;background:linear-gradient(160deg,rgba(255,194,61,.22),rgba(255,93,158,.14) 60%,rgba(160,125,220,.16));border:1px solid rgba(255,214,120,.35)}
.eyebrow{font:800 11px/1 var(--body);letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.today h2{margin:8px 0 6px;font:800 30px/1 var(--display);text-wrap:balance}
.today p{margin:0 0 12px;font:600 15px/1.45 var(--body);color:var(--ink-dim);max-width:44ch}
.meta{display:flex;gap:12px;flex-wrap:wrap;font:700 13px/1 var(--body);color:var(--ink-dim);margin-bottom:14px}
.meta .done{color:var(--ok)}
.play{border:none;border-radius:16px;padding:14px 22px;font:800 20px/1 var(--display);background:linear-gradient(180deg,#ffd666,#f0a91a);color:#3a2300;box-shadow:0 6px 0 #b8770a,0 12px 24px rgba(0,0,0,.3)}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 #b8770a}
.btn2{border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:14px;padding:11px 14px;font:800 14px/1 var(--body)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sect{display:flex;flex-direction:column;gap:8px}
.sect h3{margin:4px 0 0;font:800 12px/1 var(--body);letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mcard{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mcard b{font:700 16px/1.1 var(--display)}
.mcard span{font:700 12px/1.2 var(--body);color:var(--ink-dim)}
.mcard .tick{color:var(--ok)}
.mcard.custom{border-style:dashed}

.resume{border-radius:18px;padding:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}

.sheet{position:fixed;inset:0;background:rgba(10,8,6,.7);display:grid;place-items:center;padding:16px;padding-top:calc(16px + var(--st));padding-bottom:calc(16px + var(--sb))}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font:800 12px/1 var(--body);letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.field input,.field select{font:700 16px/1.2 var(--body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);-webkit-user-select:text;user-select:text}
.field select option{background:#222;color:#fff}
.check{display:flex;gap:10px;align-items:center;font:700 15px/1.2 var(--body)}

#cricket{position:fixed;inset:0;background:#2d5a2a;z-index:20}

  side: THREE.BackSide, depthWrite:false, fog:false,
  uniforms: { sunDir:{value:SUN_DIR}, top:{value:new THREE.Color('#4f86c2')}, mid:{value:new THREE.Color('#9fbfd8')}, horizon:{value:new THREE.Color('#ffc58f')} },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 sunDir; uniform vec3 top; uniform vec3 mid; uniform vec3 horizon; varying vec3 vDir;
    void main(){ vec3 d = normalize(vDir); float h = d.y;

Object.assign(sun.shadow.camera, { left:-75, right:75, top:75, bottom:-75, near:1, far:420 });

/* =========================================================
   Materials & builders
   ========================================================= */

/* ---------- surface detail: procedural textures projected in world space ---------- */

{ // brick: 16 courses
  const [c, k] = makeCanvas(); k.fillStyle = '#f2f2f2'; k.fillRect(0, 0, 512, 512);

function checkPotholes(dt){
  car.bump = Math.max(0, (car.bump || 0) - dt*.8);
  for (const h of potholes){
    if (Math.hypot(car.pos.x - h.x, car.pos.z - h.z) < h.r + 1 && Math.abs(car.speed) > 3 && !h.hit){
      h.hit = true; car.bump = .18; car.speed *= .7; tone(90, .12, 'square', .18); tone(60, .2, 'sine', .2, .05);

}

/* =========================================================
   Merge static scenery so the phone draws a few hundred batches, not thousands
   ========================================================= */
function bakeGeometry(parts, matrixOf){
  let total = 0;
  const geos = parts.map(o => { const ge = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone(); ge.applyMatrix4(matrixOf(o)); total += ge.attributes.position.count; return ge; });
  const pos = new Float32Array(total*3), nor = new Float32Array(total*3); let off = 0;
  for (const ge of geos){ pos.set(ge.attributes.position.array, off*3); if (ge.attributes.normal) nor.set(ge.attributes.normal.array, off*3); off += ge.attributes.position.count; ge.dispose(); }
  const bg = new THREE.BufferGeometry(); bg.setAttribute('position', new THREE.BufferAttribute(pos, 3)); bg.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); bg.computeBoundingSphere(); bg.computeBoundingBox();
  return bg;
}
function mergeStatic(root, cell = 70){
  root.updateMatrixWorld(true);
  const groups = new Map(), remove = [], v = new THREE.Vector3();
  root.traverse(o => {
    if (!o.isMesh || o.isInstancedMesh || o.userData.keep) return;
    const m = o.material; if (Array.isArray(m) || m.map || m.transparent) return;
    o.getWorldPosition(v);
    const key = m.uuid + (o.castShadow ? 's' : 'n') + Math.floor(v.x/cell) + ',' + Math.floor(v.z/cell);
    let g = groups.get(key); if (!g){ g = { mat:m, cast:o.castShadow, parts:[] }; groups.set(key, g); }
    g.parts.push(o); remove.push(o);
  });
  for (const o of remove) o.parent.remove(o);
  for (const g of groups.values()){ const mm = new THREE.Mesh(bakeGeometry(g.parts, o => o.matrixWorld), g.mat); mm.castShadow = g.cast; mm.receiveShadow = true; root.add(mm); }
}
function mergeChildren(grp){
  grp.updateMatrixWorld(true);
  const groups = [];
  grp.traverse(o => { if (o.isGroup || o.isBone || o === grp) groups.push(o); });
  for (const G of groups){
    const by = new Map();
    for (const o of G.children){ if (!o.isMesh || o.isSkinnedMesh || o.material.transparent || o.material.map) continue; const k = o.material.uuid; if (!by.has(k)) by.set(k, []); by.get(k).push(o); }
    for (const arr of by.values()){
      if (arr.length < 2) continue;
      arr.forEach(o => o.updateMatrix());
      const mm = new THREE.Mesh(bakeGeometry(arr, o => o.matrix), arr[0].material); mm.castShadow = true; mm.receiveShadow = true;
      arr.forEach(o => G.remove(o)); G.add(mm);
    }
  }
}

function stepTarget(step){

}

  if (!ms || ms.finished) return;
  ms.time += dt;
  const step = ms.def.steps[ms.i]; if (!step) return;
  const p = activePos(); const onFoot = !state.inCar;
  if (step.t === 'goto'){ const pl = PLACES[step.place]; if (Math.hypot(p.x - pl.pos[0], p.z - pl.pos[1]) < pl.r + (onFoot ? 0 : 2)) completeStep(); }

async function voiceRecorder(box){
  let rec = null, chunks = [], url = null, timer = 0;
  box.innerHTML = `<button class="btn2" id="vRec">🎙️ Record a voice note</button><span id="vStat"></span>`;
  const stat = box.querySelector('#vStat'), btn = box.querySelector('#vRec');
  btn.onclick = async () => {
    if (rec && rec.state === 'recording'){ rec.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      const type = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus', ''].find(t => !t || MediaRecorder.isTypeSupported(t));
      rec = new MediaRecorder(stream, type ? { mimeType:type, audioBitsPerSecond:24000 } : { audioBitsPerSecond:24000 }); chunks = [];
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = () => { clearTimeout(timer); stream.getTracks().forEach(t => t.stop()); const blob = new Blob(chunks, { type:rec.mimeType }); const fr = new FileReader(); fr.onload = () => { url = fr.result; box.dataset.audio = url; stat.innerHTML = `<audio controls src="${url}"></audio>`; btn.textContent = '🎙️ Record again'; }; fr.readAsDataURL(blob); };
      rec.start(); btn.textContent = '⏹️ Stop'; stat.textContent = ' Recording (up to 20 seconds)...'; timer = setTimeout(() => rec.state === 'recording' && rec.stop(), 20000);

  };
}

const canSpeak = 'speechSynthesis' in window;

  if (!canSpeak) return; speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu, '')); const vs = speechSynthesis.getVoices();
  u.voice = vs.find(v => /en[-_]ZA/i.test(v.lang)) || vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; u.rate = .92; u.pitch = 1.05; speechSynthesis.speak(u);
}

    mg.g.update(st, dt, t);

    else { mg.camPos.lerp(st.camPos, 1 - Math.exp(-5*dt)); mg.camLook.lerp(st.camLook, 1 - Math.exp(-7*dt)); }
    const wantFov = portrait() ? Math.min(82, (st.fov || 58)*1.42) : (st.fov || 58); if (Math.abs(camera.fov - wantFov) > .1){ camera.fov = lerp(camera.fov, wantFov, 1 - Math.exp(-6*dt)); camera.updateProjectionMatrix(); }
    camera.position.copy(mg.camPos); if (portrait()) camera.position.sub(mg.camLook).multiplyScalar(1.18).add(mg.camLook); camera.lookAt(mg.camLook); focusSun(mg.camLook.x, mg.camLook.z);
    st.msgT -= dt; if (st.msgT <= 0) $('#mgMsg').classList.remove('pop');
    updMiniHud();
  } else {
    if (window.__shotCam && state.mode === 'shot'){ const sc = window.__shotCam; const w = sc.who === 'arry' ? arry : dad; const cx = sc.who === 'both' ? (dad.pos.x + arry.pos.x)/2 : w.pos.x, cz = sc.who === 'both' ? (dad.pos.z + arry.pos.z)/2 : w.pos.z; const f = dad.face; camera.position.set(cx + Math.sin(f)*sc.dist, sc.h, cz + Math.cos(f)*sc.dist); camera.lookAt(cx, sc.h - .05, cz); dad.animate(dt); arry.animate(dt); dad.sync(); arry.sync(); focusSun(cx, cz); if (composer) composer.render(dt); else renderer.render(scene, camera); return; }
    // menu: slow orbit over the town
    menuAng += dt * .06;
    const narrow = innerWidth < innerHeight;
    const cx = 13, cz = 32, ang = -1.35 + Math.sin(menuAng) * .22, rr = narrow ? 5.6 : 4.3;
    const rx = Math.cos(ang), rz = -Math.sin(ang);
    arry.pos.set(cx + rx*.5, 0, cz + rz*.5); dad.pos.set(cx - rx*.55, 0, cz - rz*.55);
    if (dog.g.parent === world){ dog.pos.set(cx + rx*1.5 + Math.sin(ang)*.8, 0, cz + rz*1.5 + Math.cos(ang)*.8); dog.face = ang - .9; dog.vx = dog.vz = 0; dog.animate(dt); dog.sync(); }
    camera.position.set(cx + Math.sin(ang)*rr, narrow ? 1.6 : 1.35, cz + Math.cos(ang)*rr);
    const k = narrow ? 0 : 1.55;
    camera.lookAt(cx - rx*k, narrow ? .55 : 1.05, cz - rz*k);
    focusSun(cx, cz); beacon.visible = false;
    for (const w of [dad, arry]){ w.vx = w.vz = 0; w.y = 0; w.face = ang + (w === arry ? -.2 : .2); w.animate(dt); w.sync(); }
    for (const c of coins){ c.m.rotation.y = t*2.4; }
  }
  updateNPCs(dt);
  updateBirds(dt, t); updateSparks(dt); updateBubbles();
  for (const it of pickups){ it.g.position.y = .15 + Math.sin(t*3)*.08; it.g.rotation.y = t*1.2; it.g.userData.ring.scale.setScalar(1 + Math.sin(t*4)*.08); }
  if (beacon.visible){ beacon.userData.col.material.opacity = .16 + Math.sin(t*3)*.06; beacon.userData.ring.scale.setScalar(1 + (t*.8 % 1)*.6); beacon.userData.ring.material.opacity = .9 - (t*.8 % 1)*.8; }
  if (flag) flag.rotation.y = Math.sin(t*2)*.25;
  // labels: show within range
  const lp = state.mode === 'menu' ? null : activePos();
  for (const l of labels){ const d = lp ? Math.hypot(l.position.x - lp.x, l.position.z - lp.z) : 0; l.visible = !lp || d < 110; l.material.opacity = lp ? clamp((110 - d)/30, 0, 1) : .95; }
  sky.position.copy(camera.position);
  updateCricket(dt);
  if ($('#cricket').hidden){ if (composer) composer.render(dt); else renderer.render(scene, camera); }
  if ((state.mode === 'play' || state.mode === 'mini') && playMode === 'free' && isArryPhone()){
    save.free = save.free && save.free.date === todayKey() ? save.free : { date:todayKey(), used:0 }; save.free.used += dt;
    if (Math.floor(save.free.used) % 10 === 0) persist();
    if (freeLeft() <= 0){ persist(); if (mg.on) closeMini(); clearMissionObjects(); ms = null; resetToHome(); playMode = 'together'; openMenu(false); toast('Free play is done for today. See you at Together Time! 💛', true); }
  }
  { const r = save.ritual; if (r && r.date === todayKey() && r.startedAt && !r.warned && !r.done.goodbye && Date.now() - r.startedAt > 13*60e3){ r.warned = true; persist(); toast('Two minutes left. Time for the goodbye hug soon! 🤗', true); } }
  if (state.mode === 'play' && save.quality === 'auto'){
    fpsMon.t += dt; fpsMon.n++;
    if (fpsMon.t > 4){ const fps = fpsMon.n / fpsMon.t; fpsMon.t = 0; fpsMon.n = 0; if (fps < 40 && quality === 'high') applyQuality('medium'); else if (fps < 30 && quality === 'medium') applyQuality('low'); }
  }
  clouds.rotation.y += dt * .004;
}
resetToHome();
openMenu(false);
requestAnimationFrame(frame);
window.__clayTime = () => { const t0 = performance.now(); clayCache.clear(); makeHero('dad', 'casual'); const t1 = performance.now(); makeHero('arry', 'pink'); return [Math.round(t1 - t0), Math.round(performance.now() - t1)]; };
window.__set = (d, a) => { setOutfit('dad', d); setOutfit('arry', a); };
window.__dog = () => ({ x:dog.pos.x, z:dog.pos.z, mode:dog.mode });
window.__dbg = { camera, mg:() => mg, winMini:() => { mg.st.forceScore = mg.g.target; endMini(); }, cr:() => cr, renderer, scene, completeStep:() => completeStep(), endCricket:() => { cr.active = false; cr.runs = 20; endCricket(); } };
window.__npcs = () => npcs.map(n => [n.pos.x, n.pos.z]);
window.__aw = { buddy, net, netStart, extra:[BIG_FRIDAY, BDAY_MISSION, XMAS_MISSION], state, MISSIONS, startMission, active, car, enterCar, exitCar, PLACES, cam, input, openCricket, ms:() => ms };
</script>
